services:
  - name: starvnt-backend
    type: web
    env: node
    branch: main
    root: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        value: "REPLACE_WITH_YOUR_MONGODB_URI"
        sync: false
      - key: JWT_SECRET
        value: "REPLACE_WITH_A_STRONG_SECRET"
        sync: false
      - key: CLIENT_ORIGIN
        value: "REPLACE_WITH_FRONTEND_URL"
        sync: false
